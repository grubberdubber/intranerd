    CalendarEventUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        date: { type: string, format: date }
        role: { type: string, enum: [STUDENT, TEACHER] }
        authorName: { type: string }
    CalendarYear:
      type: object
      properties:
        year: { type: integer }
        events:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        holidays:
