components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    SubjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Year:
      name: year
      in: query
      schema:
        type: integer
        minimum: 1900
        maximum: 2100
        default: 2026
  responses:
    Validation:
      description: Error de validación Zod
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflicto (duplicado, cupo lleno, capacidad inconsistente)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        error:
          type: string
          nullable: true
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        data:
          type: object
          nullable: true
          example: null
        error:
          type: string
          example: Datos de entrada inválidos.
        details:
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
                  code: { type: string }
            - type: object
              additionalProperties: true
    Paginated:
      type: object
      properties:
        items:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
            hasNextPage: { type: boolean }
            hasPreviousPage: { type: boolean }
    GradeBoard:
      type: object
      properties:
        studentName:
          type: string
          nullable: true
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/Subject"
        summary:
          type: object
          properties:
            subjectCount: { type: integer }
            gradedSubjectCount: { type: integer }
            approvedCount: { type: integer }
            failedCount: { type: integer }
            pendingCount: { type: integer }
            generalAverage:
              type: number
              nullable: true
            passingGrade:
              type: number
              example: 4
    Subject:
      type: object
      properties:
        id: { type: string, example: sub_abc123 }
        name: { type: string }
        studentName: { type: string }
        teacherName:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        grades:
          type: object
          properties:
            semester1:
              type: array
              items:
                $ref: "#/components/schemas/Grade"
            semester2:
              type: array
              items:
                $ref: "#/components/schemas/Grade"
        semesterAverages:
          type: object
          properties:
            semester1:
              type: number
              nullable: true
            semester2:
              type: number
              nullable: true
        finalAverage:
          type: number
          nullable: true
        status:
          type: string
          enum: [APROBADO, REPROBADO, SIN_NOTAS]
        approved:
          type: boolean
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubjectInput:
      type: object
      required: [name, studentName]
      properties:
        name: { type: string, maxLength: 100 }
        studentName: { type: string, maxLength: 120 }
        teacherName: { type: string, maxLength: 120 }
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          example: "#1e40af"
    SubjectUpdate:
      type: object
      properties:
        name: { type: string }
        studentName: { type: string }
        teacherName: { type: string }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    Grade:
      type: object
      properties:
        id: { type: string, example: grd_abc123 }
        subjectId: { type: string }
        semester:
          type: integer
          enum: [1, 2]
        value:
          type: number
          minimum: 1
          maximum: 7
          example: 6.5
        label:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GradeInput:
      type: object
      required: [semester, value]
      properties:
        semester:
          type: integer
          enum: [1, 2]
        value:
          type: number
          minimum: 1
          maximum: 7
        label: { type: string, maxLength: 80 }
    GradeUpdate:
      type: object
      properties:
        semester: { type: integer, enum: [1, 2] }
        value: { type: number, minimum: 1, maximum: 7 }
        label: { type: string, maxLength: 80 }
    MissingPerson:
      type: object
      properties:
        id: { type: string, example: msp_abc123 }
        name: { type: string }
        age:
          type: integer
          nullable: true
        description: { type: string }
        lastSeenPlace: { type: string }
        contact: { type: string }
        photoUrl:
          type: string
          nullable: true
        exampleImageUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [MISSING, FOUND]
        found: { type: boolean }
        foundAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MissingPersonInput:
      type: object
      required: [name, description, lastSeenPlace, contact]
      properties:
        name: { type: string, maxLength: 120 }
        age: { type: integer, minimum: 0, maximum: 120 }
        description: { type: string, maxLength: 2000 }
        lastSeenPlace: { type: string, maxLength: 200 }
        contact: { type: string, maxLength: 200 }
        photo:
          type: string
          format: binary
        photoUrl: { type: string }
        exampleImageUrl: { type: string }
        status: { type: string, enum: [MISSING, FOUND] }
    MissingPersonUpdate:
      type: object
      properties:
        name: { type: string }
        age: { type: integer, minimum: 0, maximum: 120 }
        description: { type: string }
        lastSeenPlace: { type: string }
        contact: { type: string }
        photoUrl: { type: string }
        exampleImageUrl: { type: string }
        status: { type: string, enum: [MISSING, FOUND] }
    Teacher:
      type: object
      properties:
        id: { type: string, example: tch_abc123 }
        name: { type: string }
        subject:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        reviewCount: { type: integer }
        totalPoints: { type: integer }
        averageRating:
          type: number
          nullable: true
          example: 4.5
        ratingDistribution:
          type: object
          additionalProperties:
            type: integer
          example: { "1": 0, "2": 0, "3": 1, "4": 2, "5": 3 }
        createdAt: { type: string, format: date-time }
    Review:
      type: object
      properties:
        id: { type: string, example: rev_abc123 }
        teacherId: { type: string }
        studentName: { type: string }
        text: { type: string }
        rating:
          type: integer
          minimum: 1
          maximum: 5
        evidenceUrl:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }
    ReviewInput:
      type: object
      required: [studentName, text, rating]
      properties:
        studentName: { type: string, maxLength: 120 }
        text: { type: string, maxLength: 2000 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        evidence:
          type: string
          format: binary
        evidenceUrl: { type: string }
    LostFoundItem:
      type: object
      properties:
        id: { type: string, example: lf_abc123 }
        type:
          type: string
          enum: [FOUND, LOST]
        reportedBy: { type: string }
        contact: { type: string }
        description: { type: string }
        location:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        exampleImageUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, CLAIMED, RETURNED]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LostFoundInput:
      type: object
      required: [type, reportedBy, contact, description]
      properties:
        type: { type: string, enum: [FOUND, LOST] }
        reportedBy: { type: string }
        contact: { type: string }
        description: { type: string }
        location: { type: string }
        photo:
          type: string
          format: binary
        photoUrl: { type: string }
        exampleImageUrl: { type: string }
        status: { type: string, enum: [OPEN, CLAIMED, RETURNED] }
    LostFoundUpdate:
      type: object
      properties:
        type: { type: string, enum: [FOUND, LOST] }
        reportedBy: { type: string }
        contact: { type: string }
        description: { type: string }
        location: { type: string }
        photoUrl: { type: string }
        exampleImageUrl: { type: string }
        status: { type: string, enum: [OPEN, CLAIMED, RETURNED] }
    CalendarEvent:
      type: object
      properties:
        id: { type: string, example: cal_abc123 }
        title: { type: string }
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date
        role:
          type: string
          enum: [STUDENT, TEACHER]
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CalendarEventInput:
      type: object
      required: [title, date, role, authorName]
      properties:
        title: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        date: { type: string, format: date }
        role:
          type: string
          enum: [STUDENT, TEACHER, alumno, profesor]
