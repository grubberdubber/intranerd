openapi: 3.0.3
info:
  title: IntraNerd API
  version: 1.0.0
  description: |
    API REST de la plataforma escolar IntraNerd. Cubre los ocho módulos:
    notas semestrales, talleres, personas extraviadas, calificación de
    profesores, objetos perdidos, calendario escolar, anuncios y tareas.

    **Base canónica:** `/api/v1`; alias sin versión: `/api`.
    **Persistencia:** SQLite (`node:sqlite`) en un volumen Docker.
    **Formato de éxito:** `{ "success": true, "data": …, "error": null }`.
    **Formato de error:** `{ "success": false, "data": null, "error": "…", "details": … }`.
    **Notas:** escala chilena 1.0–7.0, aprobación desde 4.0.
    **Archivos:** multipart con campo `photo`/`evidence` (JPEG, PNG, WebP, GIF,
    MP4, WebM; máx. 10 MB) o `photoUrl` con URL/ruta.
    **Roles:** la SPA firma el contenido con el perfil local (alumno, profesor,
    dirección); la API no implementa autenticación en esta versión.
  contact:
    name: Equipo IntraNerd
  license:
    name: MIT
servers:
  - url: http://localhost:8080/api
    description: Stack Docker (Nginx → API)
  - url: http://localhost:4000/api/v1
    description: API directa en desarrollo
tags:
  - name: Salud
  - name: Notas
  - name: Personas extraviadas
  - name: Profesores
  - name: Objetos perdidos
  - name: Calendario
  - name: Talleres
  - name: Anuncios
  - name: Tareas
paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado de la API y de SQLite
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          service:
                            type: string
                          version:
                            type: string
                          uptime:
                            type: integer
                          timestamp:
                            type: string
                            format: date-time
  /grades:
    get:
      tags: [Notas]
      summary: Asignaturas, notas, promedios y resumen del alumno
      parameters:
        - name: studentName
          in: query
          description: Si se omite, devuelve todas las asignaturas.
          schema:
            type: string
      responses:
        "200":
          description: Listado con cálculos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GradeBoard"
        "422":
          $ref: "#/components/responses/Validation"
  /grades/subjects:
    post:
      tags: [Notas]
      summary: Crear asignatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Asignatura creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Subject"
        "422":
          $ref: "#/components/responses/Validation"
  /grades/subjects/{id}:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      tags: [Notas]
      summary: Detalle de asignatura con notas y promedios
      responses:
        "200":
          description: Asignatura
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Subject"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Notas]
      summary: Editar asignatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: Asignatura actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Subject"
    delete:
      tags: [Notas]
      summary: Eliminar asignatura y sus notas
      responses:
        "200":
          description: Asignatura eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /grades/subjects/{id}/grades:
    post:
      tags: [Notas]
      summary: Agregar nota a un semestre
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeInput"
      responses:
        "201":
          description: Nota agregada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          grade:
                            $ref: "#/components/schemas/Grade"
                          subject:
                            $ref: "#/components/schemas/Subject"
        "422":
          $ref: "#/components/responses/Validation"
  /grades/entries/{gradeId}:
    parameters:
      - name: gradeId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Notas]
      summary: Editar una nota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeUpdate"
      responses:
        "200":
          description: Nota y asignatura recalculada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          grade:
                            $ref: "#/components/schemas/Grade"
                          subject:
                            $ref: "#/components/schemas/Subject"
    delete:
      tags: [Notas]
      summary: Eliminar una nota
      responses:
        "200":
          description: Nota eliminada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          subject:
                            $ref: "#/components/schemas/Subject"

  /missing-persons:
    get:
      tags: [Personas extraviadas]
      summary: Listar reportes
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [MISSING, FOUND]
        - name: q
          in: query
          description: Búsqueda por nombre, lugar o contacto (sin distinguir mayúsculas ni acentos)
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reportes paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Paginated"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/MissingPerson"
    post:
      tags: [Personas extraviadas]
      summary: Crear reporte de emergencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissingPersonInput"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MissingPersonInput"
      responses:
        "201":
          description: Reporte creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MissingPerson"
        "422":
          $ref: "#/components/responses/Validation"
  /missing-persons/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Personas extraviadas]
      summary: Detalle de un reporte
      responses:
        "200":
          description: Reporte
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MissingPerson"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Personas extraviadas]
      summary: Editar reporte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissingPersonUpdate"
      responses:
        "200":
          description: Reporte actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MissingPerson"
    delete:
      tags: [Personas extraviadas]
      summary: Eliminar reporte
      responses:
        "200":
          description: Reporte eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /missing-persons/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Personas extraviadas]
      summary: Cambiar estado MISSING/FOUND
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [MISSING, FOUND]
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MissingPerson"
  /missing-persons/{id}/found:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Personas extraviadas]
      summary: Marcar como encontrado (atajo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                found:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Reporte marcado como encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MissingPerson"

  /teachers:
    get:
      tags: [Profesores]
      summary: Directorio con promedio, puntos y distribución
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: subject
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Profesores paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Paginated"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/Teacher"
    post:
      tags: [Profesores]
      summary: Crear profesor
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                subject: { type: string }
                photo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Profesor creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Teacher"
  /teachers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Profesores]
      summary: Detalle con reseñas y distribución
      responses:
        "200":
          description: Profesor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Teacher"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Profesores]
      summary: Editar profesor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                subject: { type: string }
                photoUrl: { type: string }
      responses:
        "200":
          description: Profesor actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Teacher"
    delete:
      tags: [Profesores]
      summary: Eliminar profesor y sus reseñas
      responses:
        "200":
          description: Profesor eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /teachers/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Profesores]
      summary: Reseñas del profesor
      responses:
        "200":
          description: Reseñas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Review"
    post:
      tags: [Profesores]
      summary: Calificar y opinar (1–5 estrellas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Reseña creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          review:
                            $ref: "#/components/schemas/Review"
                          teacher:
                            $ref: "#/components/schemas/Teacher"
        "422":
          $ref: "#/components/responses/Validation"
  /teachers/{id}/reviews/{reviewId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: reviewId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Profesores]
      summary: Eliminar una reseña
      responses:
        "200":
          description: Reseña eliminada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Teacher"

  /lost-found:
    get:
      tags: [Objetos perdidos]
      summary: Doble panel de objetos encontrados y avisos de pérdida
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [FOUND, LOST]
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, CLAIMED, RETURNED]
        - name: q
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Publicaciones paginadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Paginated"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/LostFoundItem"
    post:
      tags: [Objetos perdidos]
      summary: Publicar objeto encontrado o aviso de pérdida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LostFoundInput"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/LostFoundInput"
      responses:
        "201":
          description: Publicación creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LostFoundItem"
  /lost-found/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Objetos perdidos]
      summary: Detalle de publicación
      responses:
        "200":
          description: Publicación
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LostFoundItem"
    patch:
      tags: [Objetos perdidos]
      summary: Editar publicación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LostFoundUpdate"
      responses:
        "200":
          description: Publicación actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LostFoundItem"
    delete:
      tags: [Objetos perdidos]
      summary: Eliminar publicación
      responses:
        "200":
          description: Publicación eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /lost-found/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Objetos perdidos]
      summary: Cambiar estado de la publicación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [OPEN, CLAIMED, RETURNED]
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LostFoundItem"

  /calendar:
    get:
      tags: [Calendario]
      summary: Eventos y feriados de un año
      parameters:
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Calendario anual
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CalendarYear"
  /calendar/holidays:
    get:
      tags: [Calendario]
      summary: Feriados chilenos calculados
      parameters:
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Feriados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Holiday"
  /calendar/events:
    get:
      tags: [Calendario]
      summary: Consultar evaluaciones
      parameters:
        - $ref: "#/components/parameters/Year"
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: role
          in: query
          schema:
            type: string
            enum: [STUDENT, TEACHER, ALUMNO, PROFESOR]
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: authorName
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Eventos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CalendarEvent"
    post:
      tags: [Calendario]
      summary: Programar prueba o evaluación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Evento creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CalendarEvent"
        "422":
          $ref: "#/components/responses/Validation"
  /calendar/events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Calendario]
      summary: Detalle de evento
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CalendarEvent"
    patch:
      tags: [Calendario]
      summary: Editar evento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventUpdate"
      responses:
        "200":
          description: Evento actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CalendarEvent"
    delete:
      tags: [Calendario]
      summary: Eliminar evento
      responses:
        "200":
          description: Evento eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /workshops:
    get:
      tags: [Talleres]
      summary: Catálogo con cupos disponibles
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: available
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Talleres paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Paginated"
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/Workshop"
    post:
      tags: [Talleres]
      summary: Crear taller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopInput"
      responses:
        "201":
          description: Taller creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Workshop"
        "422":
          $ref: "#/components/responses/Validation"
  /workshops/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Talleres]
      summary: Detalle con inscripciones
      responses:
        "200":
          description: Taller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Workshop"
    patch:
      tags: [Talleres]
      summary: Editar taller (valida cupo vs. inscritos)
      requestBody:
        required: true
        content:
