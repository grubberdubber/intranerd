      <rect x="1534" y="542" width="158" height="8" rx="4" fill="#94a3b8" opacity=".55"/>
      <rect x="1508" y="572" width="14" height="14" rx="4" fill="#2563eb"/>
      <path d="m1511 579 3 3 5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
