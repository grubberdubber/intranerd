      <rect x="1508" y="604" width="14" height="14" rx="4" fill="#dbeafe"/>
      <rect x="1534" y="606" width="174" height="8" rx="4" fill="#94a3b8" opacity=".38"/>
      <rect x="1508" y="636" width="14" height="14" rx="4" fill="#dbeafe"/>
      <rect x="1534" y="638" width="142" height="8" rx="4" fill="#94a3b8" opacity=".38"/>
    </g>
