<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />
    <meta
      name="description"
      content="IntraNerd — plataforma integral de gestión escolar para alumnos, profesores y administración."
    />
    <title>IntraNerd · Plataforma Escolar</title>
    <link rel="icon" href="assets/illustrations/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
